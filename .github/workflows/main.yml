name: Localhost Run SSH Terminal
on: [workflow_dispatch] # Allows you to trigger it manually

jobs:
  ssh-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Runner SSH Server
        run: |
          # 1. Start the built-in SSH server on the GitHub Runner
          sudo systemctl start ssh
          
          # 2. Set a secure password for the 'runner' user so you can log in
          echo "runner:SuperSecurePassword123!" | sudo chpasswd

          name: Pinggy SSH Terminal
           on: [workflow_dispatch]

                jobs:
          ssh-tunnel:
             runs-on: ubuntu-latest
           steps:
            - name: Configure Runner SSH Server
             run: |
            sudo systemctl start ssh
          echo "runner:SuperSecurePassword123!" | sudo chpasswd

      - name: Open Pinggy TCP Tunnel
        run: |
          echo "=========================================================="
          echo "Starting native SSH tunnel..."
          echo "=========================================================="
          
          # This establishes a raw TCP tunnel directly on port 22
          ssh -o StrictHostKeyChecking=no -R 0:localhost:22 loop@a.pinggy.io
          
