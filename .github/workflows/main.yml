name: Free SSH Terminal

on:
  workflow_dispatch: # Allows you to manually trigger the terminal from the GitHub Actions tab

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Runner SSH Server
        run: |
          # Start the built-in Linux OpenSSH server daemon on the runner
          sudo systemctl start ssh
          
          # Set the login password for the default 'runner' user account
          echo "runner:SuperSecurePassword123!" | sudo chpasswd

      - name: Open Pinggy TCP Tunnel
        run: |
          echo "=========================================================="
          echo "STARTING NATIVE TCP TUNNEL..."
          echo "Look below for the command to paste into Termux!"
          echo "=========================================================="
          
          # Connects out to Pinggy to expose the runner's local port 22 (SSH)
          # Uses StrictHostKeyChecking=no so the workflow runs headless without pausing
          ssh -o StrictHostKeyChecking=no -R 0:localhost:22 loop@a.pinggy.io
          
